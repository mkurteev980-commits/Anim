<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лесная тропа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#07090F;color:#E6EAF2;font-family:Inter,sans-serif;min-height:100%}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box}
canvas{height:calc(100vh - 90px);max-width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;display:block}
#panel{display:flex;gap:10px;align-items:center;width:min(100%,560px);font:600 14px Inter,sans-serif}
#panel button{background:#11151F;color:#FACC15;border:2px solid #FACC15;border-radius:10px;padding:6px 12px;font:800 16px Inter,sans-serif}
#seek{flex:1;accent-color:#FACC15}
#scn{color:#9AA6B8;min-width:90px}
body.noui #wrap{padding:0}
body.noui canvas{width:100vw;height:100vh;border-radius:0}
body.noui #panel{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="panel"><button id="play">⏸</button><input id="seek" type="range" min="0" max="51" step="0.01" value="0"><span id="time">0.0</span><span id="scn"></span><button id="restart">↺</button></div>
</div>
<script>
// ================== ДВИЖОК ==================
const W=1080,H=1920,DUR=10.0;let HSC=1;
const cv=document.getElementById('stage');const mainCtx=cv.getContext('2d');let ctx=mainCtx;
let T=0,playing=true,SC=1;
const OL='#1A1A1A';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const easeOut=k=>{k=clamp(k,0,1);return 1-Math.pow(1-k,3)};
const backOut=k=>{k=clamp(k,0,1);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function kf(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const [t0,v0]=keys[i-1],[t1,v1]=keys[i];return lerp(v0,v1,ease((t-t0)/(t1-t0)));}}return keys[keys.length-1][1];}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function fs(fill,w){if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=(w||4)/SC;ctx.strokeStyle=OL;ctx.stroke();}
function cap(x1,y1,x2,y2,r,col){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=OL;ctx.lineWidth=2*r+8/SC;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=2*r;ctx.stroke();}
function vgrad(c1,c2,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function diamond(cx,cy,rx,ry,col){ctx.beginPath();ctx.moveTo(cx,cy-ry);ctx.lineTo(cx+rx,cy);ctx.lineTo(cx,cy+ry);ctx.lineTo(cx-rx,cy);ctx.closePath();fs(col,5);}

// камера
let CAM={z:1,fx:W/2,fy:H/2};
function cam(z,fx,fy){const hw=W/2/z,hh=H/2/z;fx=clamp(fx,hw,W-hw);fy=clamp(fy,hh,H-hh);CAM={z,fx,fy};ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-fx,-fy);}
const w2s=(x,y)=>[(x-CAM.fx)*CAM.z+W/2,(y-CAM.fy)*CAM.z+H/2];

// кеш статичных слоёв
const LAYERS={};
function layer(key,fn){if(!LAYERS[key]){const c=document.createElement('canvas');c.width=W;c.height=H;const prev=ctx,pSC=SC;ctx=c.getContext('2d');SC=1;fn();ctx=prev;SC=pSC;LAYERS[key]=c;}return LAYERS[key];}
function bg(key,fn){ctx.drawImage(layer(key,fn),0,0);}

// IK
function ik(sx,sy,tx,ty,l1,l2,bend){let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const mx=l1+l2-0.5;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}d=Math.max(d,Math.abs(l1-l2)+1);const a=Math.atan2(dy,dx);const b=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));const ea=a+bend*b;return{ex:sx+Math.cos(ea)*l1,ey:sy+Math.sin(ea)*l1,hx:sx+dx,hy:sy+dy};}

// ================== ПЕРСОНАЖИ ==================
const RED='#D32F2F';
const KIND={
 masha:{skin:'#F6CFAE',hair:'#7A4A26',brow:'#4A2A14',iris:'#3E7A5A',headR:98,dress:'#DCE6F5',dot:'#8FA8D8',thigh:'#F6CFAE',shin:'#F6CFAE',shoe:'#E58FA5',sleeveUp:'#DCE6F5',sleeveLow:'#DCE6F5'},
 gena:{skin:'#E9B48A',hair:'#9A6A3A',brow:'#5A3A1A',iris:'#4A3A2A',headR:96,shirt:'#F4F1EA',thigh:'#2B3A67',shin:'#E9B48A',sock:'#F4F1EA',shoe:'#E6E6E6',sleeveUp:'#F4F1EA',sleeveLow:'#E9B48A'},
 kid:{skin:'#F2C6A2',hair:'#5A3A22',brow:'#3A2414',iris:'#4A3A2A',headR:98,shirt:'#F4F1EA',thigh:'#2B3A67',shin:'#F2C6A2',sock:'#F4F1EA',shoe:'#7A4A2E',sleeveUp:'#F4F1EA',sleeveLow:'#F2C6A2'}
};
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=1+k;r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);return `rgb(${r},${g},${b})`;}
function hand(x,y,dx,dy,type,col){
 const a=Math.atan2(-dx,dy);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(HSC,HSC);
 if(type==='open'){[-18,-6,6,18].forEach((fx,i)=>cap(fx*0.8,10,fx*1.35,44-(i===0||i===3?7:0),8,col));cap(-22,2,-44,20,8,col);}
 else if(type==='point'){cap(4,10,4,62,8,col);cap(-22,2,-38,18,8,col);}
 circ(0,4,28);fs(col);
 if(type==='fist'){[-18,-6,6,18].forEach(fx=>{circ(fx,24,9);fs(col,3);});cap(-20,6,4,14,7,col);}
 if(type==='point'){[-12,4,18].forEach(fx=>{circ(fx-4,24,8);fs(col,3);});}
 ctx.restore();
}
function arm(K,sd,A,o,br,sh){
 const sx=sd*70,sy=-548,l1=K.ua||130,l2=K.fa||120;let ex,ey,hx,hy;
 if(A.to){const tx=(A.to[0]-o.x)/o.s-sh,ty=(A.to[1]-o.y)/o.s-br+(o._ex||0);const r=ik(sx,sy,tx,ty,l1,l2,A.bend!==undefined?A.bend:-sd);ex=r.ex;ey=r.ey;hx=r.hx;hy=r.hy;}
 else{const a1=A.a[0],a2=A.a[1];ex=sx+Math.sin(a1)*l1;ey=sy+Math.cos(a1)*l1;hx=ex+Math.sin(a1+a2)*l2;hy=ey+Math.cos(a1+a2)*l2;}
 cap(sx,sy,ex,ey,24,K.sleeveUp);cap(ex,ey,hx,hy,21,K.sleeveLow);
 if(K.sleeveLow!==K.skin){}
 HSC=K.hs||1;hand(hx,hy,hx-ex,hy-ey,A.hand||'open',K.skin);HSC=1;
 return[hx,hy];
}
function leg(K,hx,A,sd){
 const hy=-320,l1=K.th||160,l2=K.sh||150;const a1=A[0],a2=A[1];
 const kx=hx+Math.sin(a1)*l1,ky=hy+Math.cos(a1)*l1,ax=kx+Math.sin(a1+a2)*l2,ay=ky+Math.cos(a1+a2)*l2;
 cap(hx,hy,kx,ky,27,K.thigh);cap(kx,ky,ax,ay,23,K.shin);
 if(K.sock)cap(lerp(kx,ax,0.5),lerp(ky,ay,0.5),ax,ay,25,K.sock);
 ctx.save();ctx.translate(ax,ay);ctx.rotate(-(a1+a2));rr(sd>0?-26:-48,-8,74,36,16);fs(K.shoe);ctx.restore();
}
function mashaTorso(K){
 rr(-22,-612,44,52,10);fs(K.skin);
 const p=()=>{ctx.beginPath();ctx.moveTo(-72,-560);ctx.quadraticCurveTo(-74,-592,-40,-594);ctx.lineTo(40,-594);ctx.quadraticCurveTo(74,-592,72,-560);ctx.lineTo(122,-140);ctx.quadraticCurveTo(0,-118,-122,-140);ctx.closePath();};
 p();ctx.save();ctx.fillStyle=K.dress;ctx.fill();ctx.clip();ctx.fillStyle=K.dot;for(let y=-580,r=0;y<-110;y+=40,r++)for(let x=-130+(r%2)*20;x<130;x+=40){circ(x,y,5);ctx.fill();}ctx.restore();p();fs(null);
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*16,-588,9,0,Math.PI);fs('#FFFFFF',3);}
 ctx.beginPath();ctx.moveTo(-14,-560);ctx.lineTo(0,-552);ctx.lineTo(-14,-544);ctx.closePath();fs('#E58FA5',3);ctx.beginPath();ctx.moveTo(14,-560);ctx.lineTo(0,-552);ctx.lineTo(14,-544);ctx.closePath();fs('#E58FA5',3);
}
function shirtTorso(K,o){
 rr(-22,-612,44,52,10);fs(K.skin);
 rr(-84,-336,168,64,14);fs(K.thigh);
 rr(-80,-580,160,252,30);fs(K.shirt);
 if(o.back){ctx.beginPath();ctx.moveTo(-64,-578);ctx.lineTo(64,-578);ctx.lineTo(0,-462);ctx.closePath();fs(RED);rr(-40,-590,80,16,6);fs(K.shirt,3);}
 else{
  if(o.kind==='gena'){rr(-64,-518,44,40,6);fs(null,3);rr(20,-518,44,40,6);fs(null,3);}
  [-450,-400].forEach(y=>{circ(0,y,6);fs('#F4F1EA',3);});
  ctx.beginPath();ctx.moveTo(-6,-566);ctx.lineTo(-34,-470);ctx.lineTo(-14,-474);ctx.closePath();fs(RED,3);
  ctx.beginPath();ctx.moveTo(6,-566);ctx.lineTo(26,-462);ctx.lineTo(8,-470);ctx.closePath();fs(RED,3);
  circ(0,-568,14);fs(RED,3);
  if(o.whistle){ctx.beginPath();ctx.moveTo(-34,-580);ctx.quadraticCurveTo(-10,-500,40,-478);ctx.moveTo(34,-580);ctx.lineTo(40,-478);ctx.lineWidth=4/SC;ctx.strokeStyle='#2A6ACB';ctx.stroke();rr(30,-482,40,20,8);fs('#C9CDD3',3);}
 }
 rr(-86,-346,172,18,8);fs('#5A3A22',3);
}
function mashaHair(K,cy,hr){
 ctx.beginPath();ctx.moveTo(-hr-6,cy+24);ctx.bezierCurveTo(-hr-14,cy-hr,-hr*0.45,cy-hr-22,0,cy-hr-18);ctx.bezierCurveTo(hr*0.45,cy-hr-22,hr+14,cy-hr,hr+6,cy+24);
 ctx.lineTo(hr-12,cy-28);for(let i=0;i<=8;i++){ctx.lineTo(lerp(hr-16,-hr+16,i/8),cy-58+(i%2?10:0));}ctx.lineTo(-hr+12,cy-28);ctx.closePath();fs(K.hair);
}
function bow(x,y){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-30,y-20);ctx.lineTo(x-30,y+20);ctx.closePath();fs('#FFFFFF',3);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+30,y-20);ctx.lineTo(x+30,y+20);ctx.closePath();fs('#FFFFFF',3);circ(x,y,9);fs('#FFFFFF',3);}
function genaHair(K,cy,hr){
 ctx.beginPath();ctx.moveTo(-hr-4,cy+5);ctx.bezierCurveTo(-hr-10,cy-hr,-hr*0.3,cy-hr-26,hr*0.2,cy-hr-14);ctx.bezierCurveTo(hr*0.8,cy-hr-6,hr+10,cy-hr*0.7,hr+4,cy+5);
 ctx.lineTo(hr-6,cy-40);ctx.quadraticCurveTo(hr*0.2,cy-62,-hr*0.3,cy-84);ctx.quadraticCurveTo(-hr*0.7,cy-62,-hr+6,cy-30);ctx.closePath();fs(K.hair);
 ctx.beginPath();ctx.moveTo(-hr*0.3,cy-hr-14);ctx.quadraticCurveTo(-hr*0.36,cy-96,-hr*0.3,cy-84);ctx.lineWidth=3/SC;ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.stroke();
}
function mouthDraw(m,y,t){
 ctx.lineWidth=5/SC;ctx.strokeStyle=OL;ctx.lineCap='round';
 switch(m){
 case 'smile':ctx.beginPath();ctx.arc(0,y-16,26,0.2*Math.PI,0.8*Math.PI);ctx.stroke();break;
 case 'worried':ctx.beginPath();ctx.moveTo(-22,y+2);ctx.quadraticCurveTo(-11,y-8,0,y);ctx.quadraticCurveTo(11,y+8,22,y-2);ctx.stroke();break;
 case 'scared':ctx.beginPath();ctx.ellipse(0,y+4,14,19,0,0,Math.PI*2);fs('#5A1A1F',5);break;
 case 'shout':ctx.beginPath();ctx.ellipse(0,y+6,26,30,0,0,Math.PI*2);fs('#5A1A1F',5);ctx.save();ctx.beginPath();ctx.ellipse(0,y+6,24,28,0,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(-30,y-26,60,14);ctx.fillStyle='#D9636B';ctx.beginPath();ctx.ellipse(0,y+30,16,10,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.beginPath();ctx.ellipse(0,y+6,26,30,0,0,Math.PI*2);ctx.lineWidth=5/SC;ctx.strokeStyle=OL;ctx.stroke();break;
 case 'talk':{const k=Math.abs(Math.sin(t*14));ctx.beginPath();ctx.ellipse(0,y+2,18,4+k*12,0,0,Math.PI*2);fs('#5A1A1F',5);}break;
 case 'grin':ctx.beginPath();ctx.moveTo(-44,y-10);ctx.quadraticCurveTo(0,y+40,44,y-10);ctx.quadraticCurveTo(0,y+4,-44,y-10);fs('#FFFFFF',5);ctx.lineWidth=3/SC;[-24,-9,6,21].forEach(x=>{ctx.beginPath();ctx.moveTo(x,y-3);ctx.lineTo(x,y+14);ctx.stroke();});break;
 case 'whistle':circ(0,y,12);fs('#5A1A1F',4);break;
 default:ctx.beginPath();ctx.moveTo(-16,y);ctx.lineTo(16,y);ctx.stroke();
 }
}
const BROWS={neutral:[[0,0],[0,0]],scared:[[6,-16],[6,-16]],terror:[[8,-24],[8,-24]],angry:[[-6,12],[-6,12]],happy:[[-4,-8],[-4,-8]],sly:[[-2,8],[-16,-6]],creepy:[[-8,6],[-8,6]]};
function face(K,o,t,cy){
 const mood=o.mood||'neutral',look=o.look||[0,0],g=o.kind==='gena';
 ctx.save();ctx.translate((o.turn||0)*22,0);
 const ex=40,ey=cy-12,rx=g?26:30,ry=g?30:35;
 const blink=!o.noBlink&&((t+(o.seed||0)*1.7)%3.9)<0.12;
 for(const sd of [-1,1]){const x=sd*ex;
  if(blink){ctx.beginPath();ctx.moveTo(x-rx,ey);ctx.quadraticCurveTo(x,ey+12,x+rx,ey);ctx.lineWidth=5/SC;ctx.strokeStyle=OL;ctx.stroke();continue;}
  ctx.beginPath();ctx.ellipse(x,ey,rx,ry,0,0,Math.PI*2);fs('#FFFFFF');
  const ir=(mood==='scared'||mood==='terror'||mood==='creepy')?(g?6:10):(g?13:15);
  const ix=x+look[0]*(rx-ir-3)/10,iy=ey+look[1]*(ry-ir-3)/10;
  circ(ix,iy,ir);ctx.fillStyle=mood==='creepy'?'#111':K.iris;ctx.fill();circ(ix,iy,ir*0.5);ctx.fillStyle='#111';ctx.fill();circ(ix-ir*0.35,iy-ir*0.4,ir*0.3);ctx.fillStyle='#fff';ctx.fill();
  if(o.kind==='masha'){ctx.lineWidth=4/SC;ctx.strokeStyle=OL;[[0.9,1.25],[0.62,1.32]].forEach(([u,v])=>{const px=x+sd*rx*u*0.9,py=ey-ry*0.8;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+sd*12,py-12);ctx.stroke();});}
 }
 if(mood==='creepy'){ctx.save();circ(0,cy,K.headR);ctx.clip();const gr=ctx.createLinearGradient(0,cy-70,0,cy+30);gr.addColorStop(0,'rgba(10,15,30,0.55)');gr.addColorStop(1,'rgba(10,15,30,0)');ctx.fillStyle=gr;ctx.fillRect(-K.headR,cy-70,K.headR*2,100);ctx.restore();}
 const by=cy-58,B=BROWS[mood]||BROWS.neutral;
 ctx.lineCap='round';ctx.strokeStyle=K.brow;ctx.lineWidth=(g?10:8)/SC;
 [-1,1].forEach((sd,i)=>{ctx.beginPath();ctx.moveTo(sd*(ex+rx+4),by+B[i][0]);ctx.lineTo(sd*(ex-rx+6),by+B[i][1]);ctx.stroke();});
 if(o.turn){ctx.beginPath();ctx.moveTo(2,cy+2);ctx.quadraticCurveTo(26*o.turn,cy+30,4,cy+36);ctx.lineWidth=4/SC;ctx.strokeStyle=OL;ctx.stroke();}else{ctx.beginPath();ctx.arc(0,cy+24,9,0.15*Math.PI,0.95*Math.PI);ctx.lineWidth=4/SC;ctx.strokeStyle=OL;ctx.stroke();}
 if(o.kind==='masha'){ctx.fillStyle='rgba(235,120,140,0.35)';circ(-62,cy+34,15);ctx.fill();circ(62,cy+34,15);ctx.fill();}
 if(g){ctx.beginPath();ctx.moveTo(0,cy+40);ctx.quadraticCurveTo(-24,cy+36,-38,cy+52);ctx.quadraticCurveTo(-18,cy+50,0,cy+46);ctx.quadraticCurveTo(18,cy+50,38,cy+52);ctx.quadraticCurveTo(24,cy+36,0,cy+40);fs(K.hair,3);}
 mouthDraw(o.mouth||'neutral',cy+(g?68:62),t);ctx.restore();
 if(o.sweat){const sy=cy-60+((t*1.2)%1)*30;ctx.beginPath();ctx.moveTo(92,sy-30);ctx.quadraticCurveTo(110,sy,92,sy+10);ctx.quadraticCurveTo(74,sy,92,sy-30);fs('#9FD3FF',3);}
}
function backHead(K,o,t,cy,hr){
 circ(-hr+2,cy+5,20);fs(K.skin);circ(hr-2,cy+5,20);fs(K.skin);
 const col=o.wet?shade(o.hair,-0.4):o.hair;
 if(o.girl){circ(0,cy+hr-6,34);fs(col);}
 circ(0,cy-4,hr+6);fs(col);
 ctx.lineWidth=3/SC;ctx.strokeStyle='rgba(0,0,0,0.25)';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*6,cy-hr+6);ctx.quadraticCurveTo(i*34,cy,i*26,cy+hr-4);ctx.stroke();}
 if(o.girl){bow(-hr+14,cy+30);bow(hr-14,cy+30);}
 if(o.wet){ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=7/SC;ctx.beginPath();ctx.arc(-20,cy-20,hr*0.7,-2.4,-1.6);ctx.stroke();
  for(let i=0;i<3;i++){const ph=(t*1.1+i*0.37+(o.seed||0)*0.13)%1;const x=-50+i*50,y=cy+hr+ph*170;ctx.globalAlpha=1-ph*0.7;ctx.beginPath();ctx.moveTo(x,y-18);ctx.quadraticCurveTo(x+11,y,x,y+8);ctx.quadraticCurveTo(x-11,y,x,y-18);fs('#9FD3FF',3);ctx.globalAlpha=1;}}
}
function head(K,o,t){
 const hr=K.headR,cy=-690;
 if(o.back){backHead(K,o,t,cy,hr);return;}
 if(o.kind==='masha'){circ(-hr-20,cy+34,36);fs(K.hair);circ(hr+20,cy+34,36);fs(K.hair);}
 circ(-hr+2,cy+5,20);fs(K.skin);circ(hr-2,cy+5,20);fs(K.skin);
 circ(0,cy,hr);fs(K.skin);
 if(o.kind==='masha'){mashaHair(K,cy,hr);bow(-hr-6,cy-4);bow(hr+6,cy-4);}
 else if(o.kind==='gena')genaHair(K,cy,hr);
 face(K,o,t,cy);
}
function person(o){
 const K=Object.assign({},KIND[o.kind]);if(o.hair)K.hair=o.hair;
 const s=o.s,t=(o.t!==undefined?o.t:T);const pSC=SC;SC=s;
 const EX=(K.th||160)+(K.sh||150)-310;o._ex=EX;
 const dk=(c,k)=>c?shade(c,k):c;
 const KL=o.turn?Object.assign({},K,{thigh:dk(K.thigh,-0.25),shin:dk(K.shin,-0.18),sock:dk(K.sock,-0.2),shoe:dk(K.shoe,-0.25),sleeveUp:dk(K.sleeveUp,-0.22),sleeveLow:dk(K.sleeveLow,-0.2)}):K;
 const KR=o.noShoeR?Object.assign({},K,{shoe:K.skin}):K;
 ctx.save();ctx.translate(o.x,o.y);if(o.sx)ctx.scale(o.sx,1);ctx.scale(s,s);ctx.translate(0,-EX);
 if(o.rot){ctx.translate(0,-320);ctx.rotate(o.rot);ctx.translate(0,320);}
 const br=o.breathe===false?0:Math.sin(t*2.5+(o.seed||0))*3;
 const sh=o.shake?Math.sin(t*70)*o.shake:0;
 if(!o.noLegs){leg(KL,-38,o.ll||[-0.04,0.02],-1);leg(KR,38,o.rl||[0.04,-0.02],1);}
 ctx.translate(sh,br);
 let hl,hr2;
 if(o.turn)hl=arm(KL,-1,o.la||{a:[-0.12,0.1]},o,br,sh);
 if(o.kind==='masha')mashaTorso(K);else shirtTorso(K,o);
 if(!o.turn)hl=arm(K,-1,o.la||{a:[-0.12,0.1]},o,br,sh);

const params=new URLSearchParams(location.search);
if(params.get('ui')==='0')document.body.classList.add('noui');

const btn=document.getElementById('play'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),scnEl=document.getElementById('scn');

let last=null;
function loop(ts){
 if(last===null)last=ts;const dt=Math.min(0.1,(ts-last)/1000);last=ts;
 if(playing){T+=dt;if(T>=DUR){T=DUR;playing=false;}}
 const i=render(T);
 btn.textContent=playing?'⏸':'▶';seek.value=T;timeEl.textContent=T.toFixed(1)+' / '+DUR.toFixed(1);scnEl.textContent=(i+1)+'. '+SCENES[i].name;
 requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
