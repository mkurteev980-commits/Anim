<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Балкон · Часть 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#07090F;color:#E6EAF2;font-family:Inter,sans-serif;min-height:100%}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box}
canvas{height:calc(100vh - 90px);max-width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;display:block}
#panel{display:flex;gap:10px;align-items:center;width:min(100%,560px);font:600 14px Inter,sans-serif}
#panel button{background:#11151F;color:#FACC15;border:2px solid #FACC15;border-radius:10px;padding:6px 12px;font:800 16px Inter,sans-serif}
#seek{flex:1;accent-color:#FACC15}
#scn{color:#9AA6B8;min-width:90px}
body.noui #wrap{padding:0}
body.noui canvas{width:100vw;height:100vh;border-radius:0}
body.noui #panel{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="panel"><button id="play">⏸</button><input id="seek" type="range" min="0" max="51" step="0.01" value="0"><span id="time">0.0</span><span id="scn"></span><button id="restart">↺</button></div>
</div>
<script>
// ================== ДВИЖОК ==================
const W=1080,H=1920,DUR=51.0;
const cv=document.getElementById('stage');const mainCtx=cv.getContext('2d');let ctx=mainCtx;
let T=0,playing=true,SC=1;
const OL='#1A1A1A';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const easeOut=k=>{k=clamp(k,0,1);return 1-Math.pow(1-k,3)};
const backOut=k=>{k=clamp(k,0,1);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function kf(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const [t0,v0]=keys[i-1],[t1,v1]=keys[i];return lerp(v0,v1,ease((t-t0)/(t1-t0)));}}return keys[keys.length-1][1];}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function fs(fill,w){if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=(w||4)/SC;ctx.strokeStyle=OL;ctx.stroke();}
function cap(x1,y1,x2,y2,r,col){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=OL;ctx.lineWidth=2*r+8/SC;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=2*r;ctx.stroke();}
function vgrad(c1,c2,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function diamond(cx,cy,rx,ry,col){ctx.beginPath();ctx.moveTo(cx,cy-ry);ctx.lineTo(cx+rx,cy);ctx.lineTo(cx,cy+ry);ctx.lineTo(cx-rx,cy);ctx.closePath();fs(col,5);}

// камера
let CAM={z:1,fx:W/2,fy:H/2};
function cam(z,fx,fy){const hw=W/2/z,hh=H/2/z;fx=clamp(fx,hw,W-hw);fy=clamp(fy,hh,H-hh);CAM={z,fx,fy};ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-fx,-fy);}
const w2s=(x,y)=>[(x-CAM.fx)*CAM.z+W/2,(y-CAM.fy)*CAM.z+H/2];

// кеш статичных слоёв
const LAYERS={};
function layer(key,fn){if(!LAYERS[key]){const c=document.createElement('canvas');c.width=W;c.height=H;const prev=ctx,pSC=SC;ctx=c.getContext('2d');SC=1;fn();ctx=prev;SC=pSC;LAYERS[key]=c;}return LAYERS[key];}
function bg(key,fn){ctx.drawImage(layer(key,fn),0,0);}

// IK
function ik(sx,sy,tx,ty,l1,l2,bend){let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const mx=l1+l2-0.5;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}d=Math.max(d,Math.abs(l1-l2)+1);const a=Math.atan2(dy,dx);const b=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));const ea=a+bend*b;return{ex:sx+Math.cos(ea)*l1,ey:sy+Math.sin(ea)*l1,hx:sx+dx,hy:sy+dy};}

// ================== ПЕРСОНАЖИ ==================
const KIND={
 boy:{skin:'#F5CBA7',top:'#4F76BF',stripe:'#8BAAE0',legs:'#5379C2',belt:'#35599E',shoe:'#7A4A2E',hair:'#6B3F24',brow:'#3B2414',iris:'#6B4423',headR:100},
 granny:{skin:'#F2C4A6',top:'#8C2F3B',legs:'#7B5B4A',shoe:'#5B3A4A',hair:'#CDD0D6',brow:'#8E9098',iris:'#4A6A8A',headR:96}
};
function hand(x,y,dx,dy,type,col){
 const a=Math.atan2(-dx,dy);ctx.save();ctx.translate(x,y);ctx.rotate(a);
 if(type==='open'){[-18,-6,6,18].forEach((fx,i)=>cap(fx*0.8,10,fx*1.35,44-(i===0||i===3?7:0),8,col));cap(-22,2,-44,20,8,col);}
 else if(type==='point'){cap(4,10,4,62,8,col);cap(-22,2,-38,18,8,col);}
 circ(0,4,28);fs(col);
 if(type==='fist'){[-18,-6,6,18].forEach(fx=>{circ(fx,24,9);fs(col,3);});cap(-20,6,4,14,7,col);}
 ctx.restore();
}
function arm(K,sd,A,o,br,sh){
 const sx=sd*70,sy=-548,l1=130,l2=120;let ex,ey,hx,hy;
 if(A.to){const tx=(A.to[0]-o.x)/o.s-sh,ty=(A.to[1]-o.y)/o.s-br;const r=ik(sx,sy,tx,ty,l1,l2,A.bend!==undefined?A.bend:-sd);ex=r.ex;ey=r.ey;hx=r.hx;hy=r.hy;}
 else{const a1=A.a[0],a2=A.a[1];ex=sx+Math.sin(a1)*l1;ey=sy+Math.cos(a1)*l1;hx=ex+Math.sin(a1+a2)*l2;hy=ey+Math.cos(a1+a2)*l2;}
 const col=A.sleeve||K.top;cap(sx,sy,ex,ey,24,col);cap(ex,ey,hx,hy,21,col);
 hand(hx,hy,hx-ex,hy-ey,A.hand||'open',K.skin);
}
function leg(K,hx,A,sd){
 const hy=-320,l1=160,l2=150;const a1=A[0],a2=A[1];
 const kx=hx+Math.sin(a1)*l1,ky=hy+Math.cos(a1)*l1,ax=kx+Math.sin(a1+a2)*l2,ay=ky+Math.cos(a1+a2)*l2;
 cap(hx,hy,kx,ky,27,K.legs);cap(kx,ky,ax,ay,24,K.legs);
 ctx.save();ctx.translate(ax,ay);ctx.rotate(-(a1+a2));rr(sd>0?-26:-48,-8,74,38,18);fs(K.shoe);ctx.restore();
}
function boyTorso(K){
 rr(-22,-612,44,52,10);fs(K.skin);
 ctx.save();rr(-78,-578,156,262,34);ctx.fillStyle=K.top;ctx.fill();ctx.clip();ctx.fillStyle=K.stripe;for(let x=-74;x<80;x+=30)ctx.fillRect(x,-580,11,270);ctx.restore();
 rr(-78,-578,156,262,34);fs(null);
 ctx.beginPath();ctx.moveTo(-44,-578);ctx.lineTo(-6,-540);ctx.lineTo(-30,-528);ctx.closePath();fs('#3E64A8',3);
 ctx.beginPath();ctx.moveTo(44,-578);ctx.lineTo(6,-540);ctx.lineTo(30,-528);ctx.closePath();fs('#3E64A8',3);
 [-500,-445,-390].forEach(y=>{circ(0,y,7);fs('#F4F1EA',3);});
 rr(-88,-342,176,22,11);fs(K.belt);
}
function grannyTorso(K){
 rr(-22,-612,44,52,10);fs(K.skin);
 ctx.beginPath();ctx.moveTo(-74,-560);ctx.quadraticCurveTo(-76,-592,-40,-594);ctx.lineTo(40,-594);ctx.quadraticCurveTo(76,-592,74,-560);ctx.lineTo(118,-150);ctx.quadraticCurveTo(0,-128,-118,-150);ctx.closePath();
 ctx.save();ctx.fillStyle=K.top;ctx.fill();ctx.clip();ctx.fillStyle='#E8B4A0';for(let y=-590,r=0;y<-130;y+=34,r++)for(let x=-130+(r%2)*17;x<130;x+=34){circ(x,y,5);ctx.fill();}ctx.restore();
 ctx.beginPath();ctx.moveTo(-74,-560);ctx.quadraticCurveTo(-76,-592,-40,-594);ctx.lineTo(40,-594);ctx.quadraticCurveTo(76,-592,74,-560);ctx.lineTo(118,-150);ctx.quadraticCurveTo(0,-128,-118,-150);ctx.closePath();fs(null);
 ctx.beginPath();ctx.moveTo(-58,-440);ctx.lineTo(58,-440);ctx.lineTo(76,-190);ctx.quadraticCurveTo(0,-176,-76,-190);ctx.closePath();fs('#E9E2CF');
 rr(-36,-330,72,50,8);fs('#DCD3BC',3);
 ctx.beginPath();ctx.moveTo(-42,-592);ctx.lineTo(0,-548);ctx.lineTo(42,-592);ctx.closePath();fs('#F4F1EA',3);
}
const HAIR=[[-102,-5],[-110,-60],[-92,-102],[-62,-128],[-36,-156],[-12,-130],[14,-160],[32,-130],[64,-146],[72,-118],[98,-96],[110,-55],[102,-5],[86,-62],[62,-76],[40,-62],[16,-80],[-8,-64],[-34,-80],[-60,-64],[-86,-66]];
function boyHair(K,cy,t,wind){ctx.beginPath();HAIR.forEach(([x,y],i)=>{const top=y<-90;const dx=wind?Math.sin(t*19+i*1.7)*wind*(top?1:0.25)-(top?wind*1.2:0):0;i?ctx.lineTo(x+dx,cy+y):ctx.moveTo(x+dx,cy+y);});ctx.closePath();fs(K.hair);}
function grannyHair(K,cy,hr){
 ctx.beginPath();ctx.moveTo(-hr-4,cy+10);ctx.bezierCurveTo(-hr-12,cy-hr*0.9,-hr*0.4,cy-hr-16,0,cy-hr-12);ctx.bezierCurveTo(hr*0.4,cy-hr-16,hr+12,cy-hr*0.9,hr+4,cy+10);
 ctx.bezierCurveTo(hr-8,cy-46,hr*0.5,cy-76,0,cy-80);ctx.bezierCurveTo(-hr*0.5,cy-76,-hr+8,cy-46,-hr-4,cy+10);ctx.closePath();fs(K.hair);
 ctx.lineWidth=3/SC;ctx.strokeStyle='rgba(0,0,0,0.25)';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*30,cy-82);ctx.quadraticCurveTo(i*36,cy-hr,i*20,cy-hr-8);ctx.stroke();}
}
function mouthDraw(m,y,t){
 ctx.lineWidth=5/SC;ctx.strokeStyle=OL;ctx.lineCap='round';
 switch(m){
 case 'smile':ctx.beginPath();ctx.arc(0,y-16,26,0.2*Math.PI,0.8*Math.PI);ctx.stroke();break;
 case 'worried':ctx.beginPath();ctx.moveTo(-22,y+2);ctx.quadraticCurveTo(-11,y-8,0,y);ctx.quadraticCurveTo(11,y+8,22,y-2);ctx.stroke();break;
 case 'scared':ctx.beginPath();ctx.ellipse(0,y+4,14,19,0,0,Math.PI*2);fs('#5A1A1F',5);break;
 case 'shout':ctx.beginPath();ctx.ellipse(0,y+6,24,30,0,0,Math.PI*2);fs('#5A1A1F',5);ctx.beginPath();ctx.ellipse(0,y+22,13,8,0,0,Math.PI*2);ctx.fillStyle='#D9636B';ctx.fill();break;
 case 'talk':{const k=Math.abs(Math.sin(t*14));ctx.beginPath();ctx.ellipse(0,y+2,18,4+k*12,0,0,Math.PI*2);fs('#5A1A1F',5);}break;
 case 'grin':ctx.beginPath();ctx.moveTo(-42,y-10);ctx.quadraticCurveTo(0,y+40,42,y-10);ctx.quadraticCurveTo(0,y+4,-42,y-10);fs('#FFFFFF',5);ctx.lineWidth=3/SC;[-22,-8,8,22].forEach(x=>{ctx.beginPath();ctx.moveTo(x,y-3);ctx.lineTo(x,y+14);ctx.stroke();});break;
 case 'pain':rr(-26,y-10,52,24,10);fs('#FFFFFF',5);ctx.beginPath();ctx.moveTo(-26,y+2);ctx.lineTo(26,y+2);ctx.lineWidth=3/SC;ctx.stroke();break;
 default:ctx.beginPath();ctx.moveTo(-16,y);ctx.lineTo(16,y);ctx.stroke();
 }
}
const BROWS={neutral:[[0,0],[0,0]],scared:[[6,-16],[6,-16]],terror:[[8,-24],[8,-24]],angry:[[-6,12],[-6,12]],happy:[[-4,-8],[-4,-8]],sly:[[-2,8],[-16,-6]],sad:[[4,-12],[4,-12]]};
function face(K,o,t,cy){
 const mood=o.mood||'neutral',look=o.look||[0,0],g=o.kind==='granny';
 const ex=40,ey=cy-12,rx=g?22:30,ry=g?24:35;
 const blink=!o.noBlink&&((t+(o.seed||0)*1.7)%3.9)<0.12;
 for(const sd of [-1,1]){const x=sd*ex;
  if(blink){ctx.beginPath();ctx.moveTo(x-rx,ey);ctx.quadraticCurveTo(x,ey+12,x+rx,ey);ctx.lineWidth=5/SC;ctx.strokeStyle=OL;ctx.stroke();continue;}
  ctx.beginPath();ctx.ellipse(x,ey,rx,ry,0,0,Math.PI*2);fs('#FFFFFF');
  const ir=(mood==='scared'||mood==='terror')?(g?7:10):(g?10:15);
  const ix=x+look[0]*(rx-ir-3)/10,iy=ey+look[1]*(ry-ir-3)/10;
  circ(ix,iy,ir);ctx.fillStyle=K.iris;ctx.fill();circ(ix,iy,ir*0.5);ctx.fillStyle='#111';ctx.fill();circ(ix-ir*0.35,iy-ir*0.4,ir*0.3);ctx.fillStyle='#fff';ctx.fill();
 }
 const by=cy-(g?52:58),B=BROWS[mood]||BROWS.neutral;
 ctx.lineCap='round';ctx.strokeStyle=K.brow;ctx.lineWidth=(g?7:9)/SC;
 [-1,1].forEach((sd,i)=>{ctx.beginPath();ctx.moveTo(sd*(ex+rx+4),by+B[i][0]);ctx.lineTo(sd*(ex-rx+6),by+B[i][1]);ctx.stroke();});
 ctx.beginPath();ctx.arc(0,cy+24,9,0.15*Math.PI,0.95*Math.PI);ctx.lineWidth=4/SC;ctx.strokeStyle=OL;ctx.stroke();
 if(g){ctx.fillStyle='rgba(230,110,110,0.35)';circ(-62,cy+34,15);ctx.fill();circ(62,cy+34,15);ctx.fill();}
 else{ctx.fillStyle='#C98A6A';[[-66,26],[-54,34],[-72,38],[66,26],[54,34],[72,38]].forEach(([x,y])=>{circ(x,cy+y,3.2);ctx.fill();});}
 mouthDraw(o.mouth||'neutral',cy+62,t);
 if(g){const gl=o.glare||0;for(const sd of [-1,1]){circ(sd*ex,ey,34);ctx.fillStyle=`rgba(${gl>0?'255,255,245':'210,235,255'},${0.12+gl*0.86})`;ctx.fill();ctx.lineWidth=5/SC;ctx.strokeStyle='#2A2A2A';ctx.stroke();
   if(gl>0){ctx.save();circ(sd*ex,ey,32);ctx.clip();ctx.strokeStyle=`rgba(255,255,255,${gl})`;ctx.lineWidth=8/SC;ctx.beginPath();ctx.moveTo(sd*ex-30,ey+10);ctx.lineTo(sd*ex+10,ey-30);ctx.stroke();ctx.restore();}}
  ctx.beginPath();ctx.moveTo(-6,ey-4);ctx.quadraticCurveTo(0,ey-12,6,ey-4);ctx.lineWidth=5/SC;ctx.strokeStyle='#2A2A2A';ctx.stroke();}
 if(o.sweat){const sy=cy-60+((t*1.2)%1)*30;ctx.beginPath();ctx.moveTo(92,sy-30);ctx.quadraticCurveTo(110,sy,92,sy+10);ctx.quadraticCurveTo(74,sy,92,sy-30);fs('#9FD3FF',3);}
}
function head(K,o,t){
 const hr=K.headR,cy=-690;
 if(o.kind==='granny'){circ(0,cy-hr-22,40);fs(K.hair);}
 circ(-hr+2,cy+5,20);fs(K.skin);circ(hr-2,cy+5,20);fs(K.skin);
 circ(0,cy,hr);fs(K.skin);
 if(o.kind==='boy')boyHair(K,cy,t,o.wind||0);else grannyHair(K,cy,hr);
 face(K,o,t,cy);
}
function blanket(){
 ctx.beginPath();ctx.moveTo(-104,-560);ctx.quadraticCurveTo(0,-596,104,-560);ctx.lineTo(130,-300);ctx.lineTo(-130,-300);ctx.closePath();
 ctx.save();ctx.fillStyle='#3E7A4E';ctx.fill();ctx.clip();ctx.fillStyle='rgba(20,50,30,0.45)';for(let x=-140;x<140;x+=48)ctx.fillRect(x,-600,20,320);for(let y=-590;y<-290;y+=48)ctx.fillRect(-140,y,280,20);ctx.fillStyle='rgba(230,190,80,0.6)';for(let x=-130;x<140;x+=48)ctx.fillRect(x,-600,4,320);ctx.restore();
 ctx.beginPath();ctx.moveTo(-104,-560);ctx.quadraticCurveTo(0,-596,104,-560);ctx.lineTo(130,-300);ctx.lineTo(-130,-300);ctx.closePath();fs(null);
}
function person(o){
 const K=KIND[o.kind],s=o.s,t=(o.t!==undefined?o.t:T);const pSC=SC;SC=s;
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(s,s);
 if(o.rot){ctx.translate(0,-320);ctx.rotate(o.rot);ctx.translate(0,320);}
 const br=o.breathe===false?0:Math.sin(t*2.5+(o.seed||0))*3;
 const sh=o.shake?Math.sin(t*70)*o.shake:0;
 if(!o.noLegs){leg(K,-38,o.ll||[-0.04,0.02],-1);leg(K,38,o.rl||[0.04,-0.02],1);}
 ctx.translate(sh,br);
 if(o.kind==='granny')grannyTorso(K);else boyTorso(K);
 arm(K,-1,o.la||{a:[-0.12,0.1]},o,br,sh);arm(K,1,o.ra||{a:[0.12,-0.1]},o,br,sh);
 if(o.blanket)blanket();
 head(K,o,t);
 ctx.restore();SC=pSC;
 return{mouth:[o.x+sh*s,o.y+(-628+br)*s]};
}

// ================== АТМОСФЕРА ==================
function snow(t,n,vx,vy,a,seed=0){ctx.fillStyle='#EAF2FF';for(let i=0;i<n;i++){const r1=rnd(i+seed),r2=rnd(i*3.7+seed+1),r3=rnd(i*7.3+seed+2),sp=0.6+r3*0.8;let x=(r1*(W+200)+t*vx*sp+Math.sin(t*1.5+i)*30)%(W+200);if(x<0)x+=W+200;x-=100;let y=(r2*(H+100)+t*vy*sp)%(H+100);if(y<0)y+=H+100;y-=50;ctx.globalAlpha=a*(0.5+r3*0.5);circ(x,y,2+r3*5);ctx.fill();}ctx.globalAlpha=1;}
function breath(x,y,t,dir=-1){const p=(t%1.1)/1.1;if(p>0.85)return;const k=p/0.85;for(let i=0;i<3;i++){const kk=clamp(k-i*0.12,0,1);if(kk<=0)continue;ctx.globalAlpha=0.45*(1-kk);ctx.fillStyle='rgb(235,242,255)';circ(x+dir*(20+kk*70+i*14),y-kk*40-i*6,8+22*kk);ctx.fill();}ctx.globalAlpha=1;}
function drawVig(){const g=ctx.createRadialGradient(540,900,420,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.62)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function steam(x,y,t){ctx.lineCap='round';for(let j=0;j<3;j++){const ph=(t*0.6+j/3)%1;ctx.globalAlpha=0.55*Math.sin(ph*Math.PI);ctx.strokeStyle='#FFFFFF';ctx.lineWidth=6;ctx.beginPath();for(let i=0;i<=10;i++){const yy=y-ph*60-i*10,xx=x+(j-1)*16+Math.sin(i*0.7+t*3+j)*8;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}ctx.globalAlpha=1;}
function whooshOverlay(k){ctx.save();ctx.fillStyle='#05070C';for(let i=0;i<9;i++){const w=50+((i*53)%110),x=((i*173+k*1700)%1400)-160;ctx.globalAlpha=(1-k)*0.92;ctx.fillRect(x,0,w,H);}ctx.globalAlpha=(1-k)*0.35;ctx.fillRect(0,0,W,H);ctx.restore();}

// ================== UI ==================
function tag(x,y,txt,col='#E53935'){ctx.font='800 24px Montserrat';const w=ctx.measureText(txt).width+26;rr(x-w/2,y-17,w,34,8);ctx.fillStyle=col;ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+1);}
function plate(lt,txt,sub,o={}){
 if(lt<0)return;const out=o.until!==undefined?clamp((o.until-lt)/0.2,0,1):1;if(out<=0)return;const k=backOut(lt/0.35);
 const col=o.red?'#E53935':'#FACC15',y=o.y||150;
 ctx.save();ctx.font='900 44px Montserrat';const tw=ctx.measureText(txt).width;ctx.font='600 26px Inter';const sw=sub?ctx.measureText(sub).width:0;
 const w=Math.max(tw,sw)+76,h=sub?112:84;
 ctx.translate(W/2,y);ctx.scale(k*out,k*out);ctx.globalAlpha=out;
 rr(-w/2,-h/2,w,h,20);ctx.fillStyle='#11151F';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=col;ctx.stroke();
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='900 44px Montserrat';ctx.fillText(txt,0,sub?-14:2);
 if(sub){ctx.font='600 26px Inter';ctx.fillStyle=o.red?'#FF8A80':'#FACC15';ctx.fillText(sub,0,30);}
 if(o.label)tag(0,-h/2,o.label);
 ctx.restore();
}
function bubble(lt,cx,cy,lines,tail,label,o={}){
 if(lt<0)return;const k=backOut(lt/0.3);

 {t0:6.0, name:'Пропасть', draw:S3, ui:U3},
 {t0:9.4, name:'Замок',    draw:S4, ui:U4},
 {t0:11.8,name:'Прыжок',   draw:S5, wh:1},
 {t0:13.6,name:'Перила',   draw:S6, ui:U6},
 {t0:16.0,name:'Стук',     draw:S7, ui:U7},
 {t0:19.6,name:'Шторка',   draw:S8},
 {t0:21.2,name:'Бабушка',  draw:S9, ui:U9},
 {t0:25.6,name:'Кухня',    draw:S10,ui:U10},
 {t0:29.6,name:'Прихожая', draw:S11,ui:U11,wh:1},
 {t0:33.8,name:'Ванная',   draw:S12,ui:U12},
 {t0:38.4,name:'Сын',      draw:S13,ui:U13},
 {t0:40.0,name:'Замок 2',  draw:S14,ui:U14},
 {t0:44.6,name:'Выбор',    draw:S15,wh:1,vig:false},
];
function sceneIndex(t){for(let i=SCENES.length-1;i>=0;i--)if(t>=SCENES[i].t0)return i;return 0;}

function render(t){
 T=t;ctx=mainCtx;SC=1;CAM={z:1,fx:W/2,fy:H/2};
 const i=sceneIndex(t),S=SCENES[i],lt=t-S.t0;
 ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 let wk=1;if(S.wh&&lt<0.3){wk=lt/0.3;ctx.translate(-(1-easeOut(wk))*160,0);}
 ctx.save();S.draw(lt,t);ctx.restore();
 ctx.restore();
 if(S.vig!==false)ctx.drawImage(layer('vig',drawVig),0,0);
 if(S.ui){ctx.save();S.ui(lt,t);ctx.restore();}
 if(S.wh&&lt<0.3)whooshOverlay(wk);
 drawSubs(t);
 return i;
}

// ================== ПЛЕЕР ==================
const params=new URLSearchParams(location.search);
if(params.get('ui')==='0')document.body.classList.add('noui');
if(params.get('t')!==null){playing=false;T=parseFloat(params.get('t'));}
const btn=document.getElementById('play'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),scnEl=document.getElementById('scn');
seek.max=DUR;
btn.onclick=()=>{if(T>=DUR)T=0;playing=!playing;};
document.getElementById('restart').onclick=()=>{T=0;playing=true;};
seek.oninput=()=>{T=parseFloat(seek.value);playing=false;};
let last=null;
function loop(ts){
 if(last===null)last=ts;const dt=Math.min(0.1,(ts-last)/1000);last=ts;
 if(playing){T+=dt;if(T>=DUR){T=DUR;playing=false;}}
 const i=render(T);
 btn.textContent=playing?'⏸':'▶';seek.value=T;timeEl.textContent=T.toFixed(1)+' / '+DUR.toFixed(1);scnEl.textContent=(i+1)+'. '+SCENES[i].name;
 requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
